version: 0
name: Mesh output inherited source record
description: Exercise a source-record child selector on a generated mesh variant.

variants:
  mesh_child_source_record:
    guards:
      - when:
          - [time, hour, range, 6, 20, exclusive]
        actions:
          - place:
              - ["Balmora, Eight Plates", "furn_de_tapestry_04", [2500.0, 960.0, -311.0], { yaw: 0.0 }]
            actions:
              - attach:
                  - ['f\Furn_De_Tapestry_03.NIF', [20.0, 0.0, 0.0]]
                actions:
                  - select:
                      recordId: furn_de_tapestry_04
                    filters: [exclude, urn_01]
                    modify:
                      scale: { to: 1.37 }
