# Intent adaptation of S3ctor's InstanceModifier_CaiusTakesWeekendsOff.yaml.
# Source: https://github.com/DreamWeave-MP/S3ctors-S3cret-St4sh/blob/5e16c717f9524a9ab049e3557ccf04ab4cca9a86/content/static_switching_system/Examples/InstanceModifier_CaiusTakesWeekendsOff.yaml
# Add this option's directory as a data directory only when choosing this
# schedule. Do not combine it with another Caius relocation example.
#
# MOM manages one weekend excursion. When the guard closes, relocation reverses
# to Caius's OpenMW starting cell and position instead of imposing the source's
# hard-coded home point. Selection follows origin identity after relocation.
# This implements the schedule's intent, not SSS's activation-only timing.
# MOM has no onGround option: the source's exact destination coordinates are
# retained and need checking when another mod changes South Wall's layout.
version: 0
name: SSS conversion - Caius Takes Weekends Off
description: A reversible weekend excursion for the original Caius in his house.
variants:
  caius_weekend_excursion:
    guards:
      - when:
          - [time, flags.isWeekend, true]
        actions:
          - modify:
              - ["Balmora, Caius Cosades' House", caius cosades, {relocate: {cell: "Balmora, South Wall Cornerclub", position: [291, 537, 261]}}]
