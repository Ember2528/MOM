# INTENT ADAPTATION: InstanceModifier_CaiusSchedule.yaml.
# Enable ONE Caius schedule option. All legs select his original home cell;
# selection follows MOM's saved origin identity after relocation.
# Nonoverlapping hour windows replace activation-order-dependent transitions.
# Night uses a fixed upright vanilla facing instead of the source's relative
# degree rotation, which can accumulate tilt. This is not a literal port.
version: 0
name: "SSS intent adaptation: Caius Daily Schedule"
description: "Roof 08–13, cornerclub 13–20, home 20–08; reversible world-state schedule."
variants:
  caius_schedule:
    guards:
      - when: [[time, hour, range, 8, 13, exclusive]]
        actions:
          - modify:
              - ["Balmora, Caius Cosades' House", "caius cosades", {relocate: {cell: {coords: [-2, -2]}, position: [-15371, -12604, 759]}}]
      - when: [[time, hour, range, 13, 20, exclusive]]
        actions:
          - modify:
              - ["Balmora, Caius Cosades' House", "caius cosades", {relocate: {cell: "Balmora, South Wall Cornerclub", position: [771, 754, -250]}}]
      - when: [[time, hour, range, 20, 8, exclusive]]
        actions:
          - modify:
              - ["Balmora, Caius Cosades' House", "caius cosades", {relocate: {cell: "Balmora, Caius Cosades' House", position: [-74, -192, 70], rotation: {yaw: 103.132414}}}]
